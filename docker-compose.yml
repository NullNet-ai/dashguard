services:
  redis:
    image: redis:alpine
    ports:
      - "6378:6379"
  platform-portal:
    image: registry.dnamicro.com/platform-portal:development
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    env_file:
      - .env
    environment:
      DEBUG: false
    ports:
      - "3000:3000"
